name: Archive export

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the archive
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install publication tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install reportlab pypdf
      - name: Generate publications and backup
        run: python scripts/export_archive.py
      - name: Verify generated files
        run: python scripts/test_export_archive.py
      - name: Upload archive export
        uses: actions/upload-artifact@v4
        with:
          name: rxxldq-writing-archive
          path: output/
          if-no-files-found: error
