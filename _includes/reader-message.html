{% if site.insights_endpoint != empty %}
<section class="reader-message" data-reader-message>
  <button class="reader-message-open" type="button" data-reader-message-open>{% if page.lang == 'en' %}Leave a private note{% else %}给作者留言{% endif %}</button>
  <dialog class="reader-message-dialog" data-reader-message-dialog aria-labelledby="reader-message-title">
    <div class="reader-message-panel">
      <button class="reader-message-close" type="button" data-reader-message-close aria-label="{% if page.lang == 'en' %}Close{% else %}关闭{% endif %}">×</button>
      <h2 id="reader-message-title">{% if page.lang == 'en' %}A private note to the author{% else %}给作者的私密留言{% endif %}</h2>
    <p class="reader-message-privacy">{% if page.lang == 'en' %}Only the author can read this.{% else %}仅作者可见。{% endif %}</p>
    <form data-reader-message-form novalidate>
      <div class="reader-message-context" data-reader-message-context hidden>
        <div class="reader-message-context-heading">
          <span>{% if page.lang == 'en' %}Quoted passage{% else %}引用原文{% endif %}</span>
          <button type="button" data-reader-message-context-clear>{% if page.lang == 'en' %}Remove{% else %}移除{% endif %}</button>
        </div>
        <blockquote data-reader-message-quote></blockquote>
        <input type="hidden" name="quote">
        <input type="hidden" name="paragraph_index">
      </div>
      <label>
        <span>{% if page.lang == 'en' %}Message{% else %}留言{% endif %}</span>
        <textarea name="message" rows="5" maxlength="3000" required></textarea>
      </label>
      <div class="reader-message-details">
        <label>
          <span>{% if page.lang == 'en' %}Name (optional){% else %}称呼（选填）{% endif %}</span>
          <input type="text" name="name" maxlength="80" autocomplete="name">
        </label>
        <label>
          <span>{% if page.lang == 'en' %}Email for a reply (optional){% else %}回复邮箱（选填）{% endif %}</span>
          <input type="email" name="email" maxlength="180" autocomplete="email" inputmode="email">
        </label>
      </div>
      <label class="reader-message-trap" aria-hidden="true">
        <span>Website</span>
        <input type="text" name="website" tabindex="-1" autocomplete="off">
      </label>
      <div class="reader-message-actions">
        <button type="submit">{% if page.lang == 'en' %}Send privately{% else %}私下发送{% endif %}</button>
        <span class="reader-message-status" data-reader-message-status role="status" aria-live="polite"></span>
      </div>
    </form>
    </div>
  </dialog>
</section>
<div class="reader-selection-actions" data-reader-selection-actions hidden>
  <button type="button" data-reader-selection-note>{% if page.lang == 'en' %}Comment on this passage{% else %}就这段留言{% endif %}</button>
  <button type="button" data-reader-selection-copy>{% if page.lang == 'en' %}Copy paragraph link{% else %}复制本段链接{% endif %}</button>
  <span class="visually-hidden" data-reader-selection-status role="status" aria-live="polite"></span>
</div>
{% endif %}
