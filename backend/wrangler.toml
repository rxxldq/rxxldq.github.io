name = "rxxldq-private-insights"
main = "src/worker.js"
compatibility_date = "2025-08-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://rxxldq.github.io,http://127.0.0.1:4000,http://localhost:4000"
ADMIN_USERNAME = "rxxldq"

# Run `wrangler d1 create rxxldq-insights`, then replace this placeholder with
# the database_id printed by Wrangler.
[[d1_databases]]
binding = "DB"
database_name = "rxxldq-insights"
database_id = "00000000-0000-0000-0000-000000000000"

# Set these with `wrangler secret put`, never in this file:
# ADMIN_PASSWORD — password for /admin
# RATE_SALT      — random secret used to hash an IP for short-term rate limiting
